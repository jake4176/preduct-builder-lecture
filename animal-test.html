<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>동물상 테스트 - 나는 강아지상? 고양이상?</title>
  <meta name="description" content="사진 한 장으로 알아보는 강아지상 vs 고양이상 테스트. 사진은 서버로 전송되지 않고 브라우저 안에서만 분석됩니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    (function () {
      var theme = 'dark';
      try {
        theme = localStorage.getItem('lotto_theme') ||
          (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 50%, #030712 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-soft: #e2e8f0;
      --badge-text: #fbbf24;
      --title-gradient: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #f59e0b 100%);
      --tint-rgb: 255, 255, 255;
      --panel-rgb: 15, 23, 42;
      --shadow-rgb: 0, 0, 0;
      --shadow-alpha: 0.5;
      --toast-bg: #0f172a;
      --toast-text: #f8fafc;
      --dog: #f59e0b;
      --dog-soft: rgba(245, 158, 11, 0.16);
      --cat: #a78bfa;
      --cat-soft: rgba(167, 139, 250, 0.16);
      color-scheme: dark;
    }

    :root[data-theme="light"] {
      --bg-gradient: radial-gradient(circle at 50% 20%, #fff7ed 0%, #f1f5f9 50%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.78);
      --card-border: rgba(15, 23, 42, 0.1);
      --accent: #d97706;
      --accent-glow: rgba(245, 158, 11, 0.25);
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-soft: #334155;
      --badge-text: #b45309;
      --title-gradient: linear-gradient(135deg, #0f172a 0%, #334155 50%, #d97706 100%);
      --tint-rgb: 15, 23, 42;
      --panel-rgb: 255, 255, 255;
      --shadow-alpha: 0.15;
      --toast-bg: #ffffff;
      --toast-text: #0f172a;
      --dog: #d97706;
      --dog-soft: rgba(217, 119, 6, 0.12);
      --cat: #7c3aed;
      --cat-soft: rgba(124, 58, 237, 0.1);
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 4rem;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Header */
    header {
      text-align: center;
      position: relative;
    }

    .theme-toggle, .back-link {
      position: absolute;
      top: 0;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .theme-toggle { right: 0; }
    .back-link { left: 0; }

    .theme-toggle:hover { transform: rotate(20deg) scale(1.08); border-color: var(--accent); }
    .back-link:hover { transform: translateX(-2px); border-color: var(--accent); }

    .theme-toggle:focus-visible, .back-link:focus-visible,
    .btn:focus-visible, .dropzone:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .theme-toggle .icon-sun { display: none; }
    :root[data-theme="light"] .theme-toggle .icon-sun { display: block; }
    :root[data-theme="light"] .theme-toggle .icon-moon { display: none; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: var(--badge-text);
      margin-bottom: 0.75rem;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: var(--title-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 1.5rem;
      padding: 1.75rem;
      box-shadow: 0 20px 40px -15px rgba(var(--shadow-rgb), var(--shadow-alpha));
    }

    /* Upload */
    .dropzone {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      aspect-ratio: 1 / 1;
      max-width: 360px;
      margin: 0 auto;
      width: 100%;
      border: 2px dashed rgba(var(--tint-rgb), 0.2);
      border-radius: 1.25rem;
      background: rgba(var(--panel-rgb), 0.45);
      color: var(--text-muted);
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.2s ease, background 0.2s ease;
      text-align: center;
      padding: 1.5rem;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.06);
    }

    .dropzone .dz-icon {
      font-size: 3rem;
      line-height: 1;
    }

    .dropzone strong {
      color: var(--text-main);
      font-size: 1.05rem;
    }

    .dropzone small {
      font-size: 0.8rem;
    }

    .dropzone.has-image {
      border-style: solid;
      padding: 0;
    }

    .dropzone.has-image > :not(img):not(.scan) { display: none; }

    .dropzone img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* same center crop the model sees */
      display: none;
    }

    .dropzone.has-image img { display: block; }

    .scan {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.75rem;
      background: rgba(var(--panel-rgb), 0.55);
      color: var(--text-main);
      font-weight: 700;
      backdrop-filter: blur(2px);
    }

    .dropzone.analyzing .scan { display: flex; }

    .scan::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      box-shadow: 0 0 16px var(--accent);
      animation: scanLine 1.2s ease-in-out infinite alternate;
    }

    @keyframes scanLine {
      from { top: 8%; }
      to { top: 92%; }
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(var(--tint-rgb), 0.2);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .model-status {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      min-height: 1.2em;
    }

    .model-status.error { color: #ef4444; font-weight: 600; }

    .privacy-note {
      margin-top: 0.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Result */
    .result-card { display: none; text-align: center; }
    .result-card.show { display: block; animation: fadeUp 0.45s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-emoji {
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .result-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .result-title.dog { color: var(--dog); }
    .result-title.cat { color: var(--cat); }
    .result-title.mix { color: var(--text-main); }

    .result-desc {
      color: var(--text-soft);
      font-size: 0.98rem;
      line-height: 1.7;
      margin-bottom: 1rem;
    }

    .traits {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .trait {
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
      background: rgba(var(--tint-rgb), 0.07);
      border: 1px solid rgba(var(--tint-rgb), 0.1);
      color: var(--text-soft);
    }

    .bars {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      text-align: left;
      margin-bottom: 1.5rem;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .bar-track {
      height: 14px;
      border-radius: 9999px;
      background: rgba(var(--tint-rgb), 0.08);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0;
      border-radius: 9999px;
      transition: width 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .bar-fill.dog { background: linear-gradient(90deg, #fbbf24, var(--dog)); }
    .bar-fill.cat { background: linear-gradient(90deg, #c4b5fd, var(--cat)); }

    /* Buttons */
    .action-row {
      display: flex;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.9rem 1.4rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 0.95rem;
      cursor: pointer;
      border: none;
      flex: 1;
      min-width: 150px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      box-shadow: 0 8px 20px -4px var(--accent-glow);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(var(--tint-rgb), 0.08);
      color: var(--text-main);
      border: 1px solid rgba(var(--tint-rgb), 0.12);
    }

    .btn-secondary:hover {
      background: rgba(var(--tint-rgb), 0.14);
      transform: translateY(-2px);
    }

    .disclaimer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .disclaimer a { color: var(--accent); }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--toast-bg);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--toast-text);
      padding: 0.8rem 1.5rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 15px 30px rgba(var(--shadow-rgb), var(--shadow-alpha)), 0 0 15px var(--accent-glow);
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      body { padding: 1.5rem 0.75rem 3rem; }
      header { padding-top: 3rem; }
      h1 { font-size: 1.9rem; }
      .card { padding: 1.25rem; }
      .action-row { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scan::before, .spinner { animation: none; }
      .bar-fill { transition: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a class="back-link" href="./" aria-label="로또 번호 추첨기로 돌아가기" title="로또 번호 추첨기로 돌아가기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </a>
      <button class="theme-toggle" id="themeToggle" type="button" onclick="toggleTheme()" aria-label="라이트 모드로 전환" title="라이트 모드로 전환">
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>
      <div class="badge">🐶 Animal Face Test 🐱</div>
      <h1>나는 강아지상? 고양이상?</h1>
      <p class="subtitle">사진 한 장으로 AI가 알려 주는 나의 동물상</p>
    </header>

    <!-- Upload -->
    <section class="card">
      <label class="dropzone" id="dropzone" for="fileInput" tabindex="0">
        <span class="dz-icon" aria-hidden="true">📷</span>
        <strong>여기를 눌러 사진을 올려 주세요</strong>
        <small>또는 사진을 끌어다 놓기 · 정면 얼굴 사진이 가장 정확해요</small>
        <img id="preview" alt="올린 사진 미리보기" />
        <div class="scan" aria-hidden="true">
          <div class="spinner"></div>
          <span>분석 중...</span>
        </div>
      </label>
      <input class="sr-only" type="file" id="fileInput" accept="image/*" />
      <p class="model-status" id="modelStatus" role="status" aria-live="polite">AI 모델을 불러오는 중...</p>
      <p class="privacy-note">🔒 사진은 서버로 전송되지 않고 내 기기 브라우저 안에서만 분석됩니다.</p>
    </section>

    <!-- Result -->
    <section class="card result-card" id="resultCard" aria-live="polite">
      <div class="result-emoji" id="resultEmoji"></div>
      <h2 class="result-title" id="resultTitle"></h2>
      <p class="result-desc" id="resultDesc"></p>
      <div class="traits" id="resultTraits"></div>

      <div class="bars">
        <div>
          <div class="bar-label"><span>🐶 강아지상</span><span id="dogPct">0%</span></div>
          <div class="bar-track"><div class="bar-fill dog" id="dogBar"></div></div>
        </div>
        <div>
          <div class="bar-label"><span>🐱 고양이상</span><span id="catPct">0%</span></div>
          <div class="bar-track"><div class="bar-fill cat" id="catBar"></div></div>
        </div>
      </div>

      <div class="action-row">
        <button class="btn btn-primary" type="button" onclick="retry()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
          다른 사진으로 하기
        </button>
        <button class="btn btn-secondary" type="button" onclick="shareResult()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
          결과 공유하기
        </button>
      </div>
    </section>

    <p class="disclaimer">
      강아지·고양이 사진으로 학습한 AI 모델(Teachable Machine)로 만든 재미용 테스트입니다.<br />
      결과는 사진의 각도·조명에 따라 달라질 수 있어요. · <a href="./">🎰 로또 번호 추첨기</a>
    </p>
  </div>

  <div id="toast">알림 메시지</div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
  <script>
    const MODEL_URL = 'https://teachablemachine.withgoogle.com/models/aoCBf3UEm/';
    // The model's labels are generic; verified with sample photos: Class 1 = dog, Class 2 = cat
    const LABEL_TO_TYPE = { 'Class 1': 'dog', 'Class 2': 'cat' };
    const PAGE_URL = 'https://jake4176.github.io/preduct-builder-lecture/animal-test.html';

    const RESULTS = {
      dog: {
        emoji: '🐶',
        title: '강아지상',
        desc: '처음 만나도 편안한 따뜻한 인상! 순하고 둥근 눈매에 웃는 얼굴이 매력적이라 주변 사람들이 쉽게 마음을 열어요.',
        traits: ['#다정다감', '#순한눈매', '#친화력만렙', '#리액션부자']
      },
      cat: {
        emoji: '🐱',
        title: '고양이상',
        desc: '시크하면서도 묘하게 끌리는 인상! 또렷한 눈매와 도도한 분위기 덕분에 첫인상은 차가워 보여도 알면 알수록 반전 매력이 있어요.',
        traits: ['#시크도도', '#또렷한눈매', '#반전매력', '#츤데레']
      },
      mix: {
        emoji: '🐶🐱',
        title: '강아지·고양이 반반상',
        desc: '따뜻함과 시크함을 모두 가진 드문 얼굴! 상황에 따라 순한 강아지 같다가도 도도한 고양이 같은 두 가지 매력을 보여 줘요.',
        traits: ['#양면매력', '#분위기메이커', '#알수록궁금']
      }
    };

    let model = null;
    let lastResult = null;
    let previewUrl = null;

    const $ = (id) => document.getElementById(id);
    const dropzone = $('dropzone');
    const fileInput = $('fileInput');
    const preview = $('preview');
    const modelStatus = $('modelStatus');

    // Start loading the model right away so it's ready by the time a photo is chosen
    const modelReady = (async () => {
      try {
        model = await tmImage.load(MODEL_URL + 'model.json', MODEL_URL + 'metadata.json');
        modelStatus.textContent = '준비 완료! 사진을 올려 보세요.';
        return model;
      } catch (err) {
        console.error(err);
        modelStatus.classList.add('error');
        modelStatus.textContent = 'AI 모델을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.';
        throw err;
      }
    })();

    fileInput.addEventListener('change', () => {
      if (fileInput.files && fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    // Keyboard: Enter/Space opens the file picker
    dropzone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        fileInput.click();
      }
    });

    ['dragenter', 'dragover'].forEach(type => dropzone.addEventListener(type, (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    }));
    ['dragleave', 'drop'].forEach(type => dropzone.addEventListener(type, (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
    }));
    dropzone.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    async function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        showToast('이미지 파일만 올릴 수 있어요.');
        return;
      }
      if (dropzone.classList.contains('analyzing')) return;

      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);

      try {
        await loadImage(preview, previewUrl);
      } catch (err) {
        showToast('사진을 열 수 없어요. 다른 사진으로 시도해 주세요.');
        return;
      }

      dropzone.classList.add('has-image', 'analyzing');
      $('resultCard').classList.remove('show');

      try {
        await modelReady;
        // Short minimum delay so the scan animation reads as "analyzing" rather than a flicker
        const [predictions] = await Promise.all([model.predict(preview), wait(1200)]);
        showResult(predictions);
      } catch (err) {
        console.error(err);
        showToast('분석에 실패했습니다. 다시 시도해 주세요.');
      } finally {
        dropzone.classList.remove('analyzing');
        fileInput.value = ''; // allow choosing the same file again
      }
    }

    function loadImage(img, src) {
      return new Promise((resolve, reject) => {
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function showResult(predictions) {
      const scores = { dog: 0, cat: 0 };
      predictions.forEach(p => {
        const type = LABEL_TO_TYPE[p.className];
        if (type) scores[type] = p.probability;
      });

      const total = scores.dog + scores.cat || 1;
      const dogPct = Math.round((scores.dog / total) * 100);
      const catPct = 100 - dogPct;
      const type = Math.abs(dogPct - catPct) <= 10 ? 'mix' : (dogPct > catPct ? 'dog' : 'cat');
      const info = RESULTS[type];

      lastResult = { type, dogPct, catPct };

      $('resultEmoji').textContent = info.emoji;
      const title = $('resultTitle');
      title.textContent = type === 'mix' ? info.title : `${Math.max(dogPct, catPct)}% ${info.title}`;
      title.className = `result-title ${type}`;
      $('resultDesc').textContent = info.desc;
      $('resultTraits').innerHTML = info.traits.map(t => `<span class="trait">${t}</span>`).join('');
      $('dogPct').textContent = `${dogPct}%`;
      $('catPct').textContent = `${catPct}%`;

      const card = $('resultCard');
      $('dogBar').style.width = '0';
      $('catBar').style.width = '0';
      card.classList.add('show');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        $('dogBar').style.width = `${dogPct}%`;
        $('catBar').style.width = `${catPct}%`;
      }));
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function retry() {
      $('resultCard').classList.remove('show');
      dropzone.scrollIntoView({ behavior: 'smooth', block: 'center' });
      fileInput.click();
    }

    async function shareResult() {
      if (!lastResult) return;
      const { type, dogPct, catPct } = lastResult;
      const headline = type === 'mix'
        ? '나는 강아지·고양이 반반상!'
        : `나는 ${Math.max(dogPct, catPct)}% ${RESULTS[type].title}!`;
      const text = `${RESULTS[type].emoji} ${headline} (강아지 ${dogPct}% · 고양이 ${catPct}%)\n너도 테스트해 봐 👉`;

      if (navigator.share) {
        try {
          await navigator.share({ title: '동물상 테스트', text, url: PAGE_URL });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return; // user closed the share sheet
        }
      }
      try {
        await navigator.clipboard.writeText(`${text} ${PAGE_URL}`);
        showToast('📋 결과가 복사되었습니다. 친구에게 붙여 넣어 보세요!');
      } catch (err) {
        showToast('복사하지 못했어요. 주소창의 링크를 공유해 주세요.');
      }
    }

    // Dark / light theme (shared with the lotto page via the same storage key)
    function updateThemeToggleLabel() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const label = isLight ? '다크 모드로 전환' : '라이트 모드로 전환';
      const btn = $('themeToggle');
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
    }

    function toggleTheme() {
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('lotto_theme', next); } catch (e) {}
      updateThemeToggleLabel();
      showToast(next === 'light' ? '☀️ 라이트 모드' : '🌙 다크 모드');
    }

    updateThemeToggleLabel();

    let toastTimer = null;
    function showToast(msg) {
      const toast = $('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }
  </script>
</body>
</html>
