<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotto 6/45 행운의 로또 번호 추첨기</title>
  <meta name="description" content="실감나는 3D 애니메이션과 맞춤형 필터링(포함/제외 번호)을 지원하는 행운의 로또 6/45 번호 추첨기입니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 50%, #030712 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      /* Lotto Ball Colors */
      --ball-yellow: radial-gradient(circle at 35% 35%, #fef08a, #eab308 50%, #a16207 100%);
      --ball-blue: radial-gradient(circle at 35% 35%, #93c5fd, #3b82f6 50%, #1d4ed8 100%);
      --ball-red: radial-gradient(circle at 35% 35%, #fca5a5, #ef4444 50%, #b91c1c 100%);
      --ball-gray: radial-gradient(circle at 35% 35%, #cbd5e1, #64748b 50%, #334155 100%);
      --ball-green: radial-gradient(circle at 35% 35%, #86efac, #22c55e 50%, #15803d 100%);
      --ball-bonus: radial-gradient(circle at 35% 35%, #f472b6, #db2777 50%, #9d174d 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 4rem;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    /* Header */
    header {
      text-align: center;
      position: relative;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
      margin-bottom: 0.75rem;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 1.5rem;
      padding: 1.75rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    /* Machine Showcase / Stage */
    .stage-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .glow-orb {
      position: absolute;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(245, 158, 11, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .machine-viewport {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      z-index: 1;
    }

    /* Ball Display */
    .set-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding: 1rem 1.25rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 1.25rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .set-group:hover {
      border-color: rgba(245, 158, 11, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -10px rgba(0, 0, 0, 0.5);
    }

    .set-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .set-info-tags {
      display: flex;
      gap: 0.5rem;
    }

    .info-tag {
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.07);
      font-size: 0.75rem;
      color: #e2e8f0;
    }

    .balls-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: center;
      min-height: 58px;
    }

    .ball {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      box-shadow: 0 8px 16px -2px rgba(0, 0, 0, 0.4),
                  inset 0 -4px 6px rgba(0, 0, 0, 0.3),
                  inset 0 4px 6px rgba(255, 255, 255, 0.4);
      position: relative;
      user-select: none;
      transition: transform 0.2s ease;
    }

    .ball:hover {
      transform: scale(1.1) rotate(5deg);
    }

    .ball.rolling {
      animation: ballRoll 0.25s infinite linear;
      filter: blur(0.5px);
    }

    .ball.pop {
      animation: ballPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes ballRoll {
      0% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(180deg); }
      100% { transform: translateY(0) rotate(360deg); }
    }

    @keyframes ballPop {
      0% { transform: scale(0) rotate(-180deg); opacity: 0; }
      70% { transform: scale(1.2) rotate(15deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); }
    }

    .ball-yellow { background: var(--ball-yellow); }
    .ball-blue   { background: var(--ball-blue); }
    .ball-red    { background: var(--ball-red); }
    .ball-gray   { background: var(--ball-gray); }
    .ball-green  { background: var(--ball-green); }
    .ball-bonus  { background: var(--ball-bonus); }

    .ball-empty {
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed rgba(255, 255, 255, 0.15);
      box-shadow: none;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .bonus-separator {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      padding: 0 0.2rem;
    }

    /* Controls */
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      width: 100%;
      margin-top: 0.5rem;
    }

    .control-item {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .control-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .select-custom, .input-custom {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .select-custom:focus, .input-custom:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    /* Action Buttons */
    .action-row {
      display: flex;
      gap: 0.85rem;
      width: 100%;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.95rem 1.6rem;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      box-shadow: 0 8px 20px -4px var(--accent-glow);
      flex: 2;
      min-width: 200px;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      box-shadow: 0 10px 25px -2px rgba(245, 158, 11, 0.5);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.12);
      flex: 1;
      min-width: 130px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    /* Options Accordion */
    .accordion-toggle {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      padding: 0.2rem 0;
    }

    .accordion-content {
      display: none;
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      animation: fadeIn 0.3s ease;
    }

    .accordion-content.open {
      display: block;
    }

    .number-picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
      gap: 0.4rem;
      margin-top: 0.75rem;
    }

    .pick-chip {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .pick-chip:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .pick-chip.selected-include {
      background: #3b82f6;
      border-color: #60a5fa;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }

    .pick-chip.selected-exclude {
      background: #ef4444;
      border-color: #f87171;
      color: #ffffff;
      opacity: 0.75;
      text-decoration: line-through;
    }

    .filter-mode-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 0.6rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* History & Statistics */
    .history-card {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .section-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .history-list::-webkit-scrollbar {
      width: 6px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 0.85rem;
      font-size: 0.875rem;
    }

    .history-balls {
      display: flex;
      gap: 0.4rem;
    }

    .mini-ball {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    /* Color Guide */
    .color-guide {
      display: flex;
      justify-content: center;
      gap: 0.85rem;
      flex-wrap: wrap;
      padding: 1rem;
      background: rgba(15, 23, 42, 0.4);
      border-radius: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .guide-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .guide-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #f8fafc;
      padding: 0.8rem 1.5rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6), 0 0 15px var(--accent-glow);
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 640px) {
      body { padding: 1.5rem 0.75rem; }
      h1 { font-size: 2rem; }
      .ball { width: 44px; height: 44px; font-size: 1.1rem; }
      .card { padding: 1.25rem; }
      .btn { font-size: 0.95rem; padding: 0.85rem 1.2rem; }
      .action-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        <span>Lotto 6/45 Simulator</span>
      </div>
      <h1>행운의 로또 번호 추첨</h1>
      <p class="subtitle">실시간 애니메이션 & 맞춤 필터링 기반 로또 번호 추첨 시뮬레이터</p>
    </header>

    <!-- Main Generator Card -->
    <section class="card stage-card">
      <div class="glow-orb"></div>
      
      <div class="machine-viewport" id="stageViewport">
        <!-- Default Single Set Display -->
        <div class="set-group">
          <div class="set-header">
            <span>SET A</span>
            <div class="set-info-tags">
              <span class="info-tag" id="summary-tag">대기 중</span>
            </div>
          </div>
          <div class="balls-wrapper" id="primaryBalls">
            <div class="ball ball-empty">?</div>
            <div class="ball ball-empty">?</div>
            <div class="ball ball-empty">?</div>
            <div class="ball ball-empty">?</div>
            <div class="ball ball-empty">?</div>
            <div class="ball ball-empty">?</div>
            <span class="bonus-separator">+</span>
            <div class="ball ball-empty" title="보너스 번호">?</div>
          </div>
        </div>
      </div>

      <!-- Controls Panel -->
      <div class="controls">
        <div class="control-item">
          <label class="control-label" for="setCount">추첨 세트 수</label>
          <select id="setCount" class="select-custom">
            <option value="1">1 세트 (A)</option>
            <option value="2">2 세트 (A~B)</option>
            <option value="3">3 세트 (A~C)</option>
            <option value="4">4 세트 (A~D)</option>
            <option value="5" selected>5 세트 (A~E, 1게임)</option>
          </select>
        </div>

        <div class="control-item">
          <label class="control-label" for="includeBonus">보너스 번호</label>
          <select id="includeBonus" class="select-custom">
            <option value="true" selected>포함 (6+1개)</option>
            <option value="false">미포함 (6개)</option>
          </select>
        </div>

        <div class="control-item">
          <label class="control-label" for="soundToggle">효과음</label>
          <select id="soundToggle" class="select-custom">
            <option value="on" selected>켜기 (ON)</option>
            <option value="off">끄기 (OFF)</option>
          </select>
        </div>
      </div>

      <!-- Actions -->
      <div class="action-row">
        <button class="btn btn-primary" id="btnDraw" onclick="startDraw()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          행운 번호 추첨하기
        </button>
        <button class="btn btn-secondary" id="btnCopy" onclick="copyNumbers()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          결과 복사
        </button>
      </div>
    </section>

    <!-- Filter & Custom Options Card -->
    <section class="card">
      <button class="accordion-toggle" id="filterToggle" onclick="toggleAccordion()">
        <span>🎯 맞춤 번호 필터링 (포함/제외 설정)</span>
        <svg id="arrowIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      
      <div class="accordion-content" id="filterContent">
        <div class="filter-mode-tabs">
          <button class="tab-btn active" id="tabInclude" onclick="setFilterMode('include')">📌 반드시 포함할 번호 (최대 5개)</button>
          <button class="tab-btn" id="tabExclude" onclick="setFilterMode('exclude')">❌ 제외할 번호</button>
        </div>
        <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:0.5rem;" id="filterGuideText">
          번호를 탭하여 고정으로 포함할 번호를 선택하세요 (최대 5개).
        </p>
        <div class="number-picker-grid" id="numberGrid"></div>
        <div style="margin-top: 1rem; display: flex; justify-content: flex-end;">
          <button class="btn btn-secondary" style="padding: 0.4rem 0.9rem; font-size: 0.85rem;" onclick="resetFilters()">필터 초기화</button>
        </div>
      </div>
    </section>

    <!-- Color Guide -->
    <div class="color-guide">
      <div class="guide-item"><span class="guide-dot" style="background: #eab308;"></span> 1 ~ 10 (노랑)</div>
      <div class="guide-item"><span class="guide-dot" style="background: #3b82f6;"></span> 11 ~ 20 (파랑)</div>
      <div class="guide-item"><span class="guide-dot" style="background: #ef4444;"></span> 21 ~ 30 (빨강)</div>
      <div class="guide-item"><span class="guide-dot" style="background: #64748b;"></span> 31 ~ 40 (회색)</div>
      <div class="guide-item"><span class="guide-dot" style="background: #22c55e;"></span> 41 ~ 45 (초록)</div>
      <div class="guide-item"><span class="guide-dot" style="background: #db2777;"></span> 보너스 (핑크)</div>
    </div>

    <!-- History Card -->
    <section class="card history-card">
      <div class="section-title-row">
        <span class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          최근 추첨 기록
        </span>
        <button class="btn btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.8rem;" onclick="clearHistory()">기록 삭제</button>
      </div>
      <div class="history-list" id="historyList">
        <div style="text-align: center; color: var(--text-muted); padding: 1.5rem 0; font-size: 0.9rem;">
          아직 추첨 기록이 없습니다. 상단의 추첨 버튼을 눌러보세요!
        </div>
      </div>
    </section>
  </div>

  <!-- Toast Notification -->
  <div id="toast">알림 메시지</div>

  <script>
    // State
    let isDrawing = false;
    let currentResults = [];
    let includeNumbers = new Set();
    let excludeNumbers = new Set();
    let currentFilterMode = 'include';
    let history = JSON.parse(localStorage.getItem('lotto_history') || '[]');

    // Web Audio Sound Synth
    const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;

    function playBeep(freq, type = 'sine', duration = 0.08) {
      if (!audioCtx || document.getElementById('soundToggle').value === 'off') return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.error(e);
      }
    }

    function playFanfare() {
      if (!audioCtx || document.getElementById('soundToggle').value === 'off') return;
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((freq, idx) => {
        setTimeout(() => playBeep(freq, 'triangle', 0.18), idx * 90);
      });
    }

    // Helper: Ball Color Class
    function getBallClass(num, isBonus = false) {
      if (isBonus) return 'ball-bonus';
      if (num <= 10) return 'ball-yellow';
      if (num <= 20) return 'ball-blue';
      if (num <= 30) return 'ball-red';
      if (num <= 40) return 'ball-gray';
      return 'ball-green';
    }

    // Generate valid random lotto set
    function generateSingleSet(includes = [], excludes = [], withBonus = true) {
      const pool = [];
      for (let i = 1; i <= 45; i++) {
        if (!excludes.includes(i)) pool.push(i);
      }

      // Filter available candidates
      let selected = [...includes];
      const remainingPool = pool.filter(n => !selected.includes(n));

      // Shuffle pool with Fisher-Yates
      for (let i = remainingPool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [remainingPool[i], remainingPool[j]] = [remainingPool[j], remainingPool[i]];
      }

      while (selected.length < 6 && remainingPool.length > 0) {
        selected.push(remainingPool.pop());
      }

      // Sort base 6 numbers
      selected.sort((a, b) => a - b);

      let bonus = null;
      if (withBonus && remainingPool.length > 0) {
        bonus = remainingPool.pop();
      }

      return { numbers: selected, bonus };
    }

    // Draw Function
    async function startDraw() {
      if (isDrawing) return;
      isDrawing = true;
      const btn = document.getElementById('btnDraw');
      btn.disabled = true;
      btn.style.opacity = '0.7';

      const setCount = parseInt(document.getElementById('setCount').value, 10);
      const withBonus = document.getElementById('includeBonus').value === 'true';
      const viewport = document.getElementById('stageViewport');

      // Clear & Pre-render Stage
      viewport.innerHTML = '';
      const setLabels = ['A', 'B', 'C', 'D', 'E'];
      currentResults = [];

      for (let s = 0; s < setCount; s++) {
        const setDiv = document.createElement('div');
        setDiv.className = 'set-group';
        setDiv.id = `set-${s}`;

        let ballsHtml = '';
        for (let i = 0; i < 6; i++) {
          ballsHtml += `<div class="ball ball-empty rolling" id="ball-${s}-${i}">?</div>`;
        }
        if (withBonus) {
          ballsHtml += `<span class="bonus-separator">+</span>`;
          ballsHtml += `<div class="ball ball-empty rolling" id="ball-${s}-bonus">?</div>`;
        }

        setDiv.innerHTML = `
          <div class="set-header">
            <span>SET ${setLabels[s]}</span>
            <div class="set-info-tags">
              <span class="info-tag" id="tag-${s}">추첨 중...</span>
            </div>
          </div>
          <div class="balls-wrapper">${ballsHtml}</div>
        `;
        viewport.appendChild(setDiv);
      }

      // Generate Data
      const inc = Array.from(includeNumbers);
      const exc = Array.from(excludeNumbers);

      for (let s = 0; s < setCount; s++) {
        currentResults.push(generateSingleSet(inc, exc, withBonus));
      }

      // Roll & Reveal Animation
      for (let s = 0; s < setCount; s++) {
        const res = currentResults[s];
        
        for (let i = 0; i < 6; i++) {
          await new Promise(r => setTimeout(r, 80));
          const el = document.getElementById(`ball-${s}-${i}`);
          const num = res.numbers[i];
          el.className = `ball ${getBallClass(num)} pop`;
          el.textContent = num;
          playBeep(300 + num * 15, 'sine', 0.06);
        }

        if (withBonus && res.bonus) {
          await new Promise(r => setTimeout(r, 100));
          const el = document.getElementById(`ball-${s}-bonus`);
          el.className = `ball ${getBallClass(res.bonus, true)} pop`;
          el.textContent = res.bonus;
          playBeep(880, 'sine', 0.1);
        }

        // Summary Info Tag
        const sum = res.numbers.reduce((a, b) => a + b, 0);
        const oddCount = res.numbers.filter(n => n % 2 !== 0).length;
        const evenCount = 6 - oddCount;
        const tagEl = document.getElementById(`tag-${s}`);
        if (tagEl) {
          tagEl.textContent = `합계: ${sum} | 홀짝 ${oddCount}:${evenCount}`;
        }
      }

      playFanfare();
      saveToHistory(currentResults);
      renderHistory();

      isDrawing = false;
      btn.disabled = false;
      btn.style.opacity = '1';
    }

    // Save & Render History
    function saveToHistory(sets) {
      const timestamp = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      sets.forEach(s => {
        history.unshift({
          time: timestamp,
          numbers: s.numbers,
          bonus: s.bonus
        });
      });
      if (history.length > 25) history = history.slice(0, 25);
      localStorage.setItem('lotto_history', JSON.stringify(history));
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      if (!history.length) {
        container.innerHTML = `
          <div style="text-align: center; color: var(--text-muted); padding: 1.5rem 0; font-size: 0.9rem;">
            아직 추첨 기록이 없습니다. 상단의 추첨 버튼을 눌러보세요!
          </div>
        `;
        return;
      }

      container.innerHTML = history.map((item, idx) => `
        <div class="history-item">
          <div style="color: var(--text-muted); font-size: 0.8rem; font-weight: 600;">${item.time}</div>
          <div class="history-balls">
            ${item.numbers.map(n => `<div class="mini-ball ${getBallClass(n)}">${n}</div>`).join('')}
            ${item.bonus ? `<span style="color:var(--accent); font-weight:700; align-self:center;">+</span><div class="mini-ball ${getBallClass(item.bonus, true)}">${item.bonus}</div>` : ''}
          </div>
        </div>
      `).join('');
    }

    function clearHistory() {
      if (!confirm('추첨 기록을 모두 삭제하시겠습니까?')) return;
      history = [];
      localStorage.removeItem('lotto_history');
      renderHistory();
      showToast('추첨 기록이 삭제되었습니다.');
    }

    // Clipboard Copy
    function copyNumbers() {
      if (!currentResults.length) {
        showToast('먼저 번호를 추첨해주세요!');
        return;
      }

      const text = currentResults.map((s, idx) => {
        const label = String.fromCharCode(65 + idx);
        const nums = s.numbers.map(n => String(n).padStart(2, '0')).join(', ');
        return `[SET ${label}] ${nums}${s.bonus ? ` + 보너스 (${s.bonus})` : ''}`;
      }).join('\n');

      navigator.clipboard.writeText(`🎰 행운의 로또 6/45 추첨 결과:\n${text}`)
        .then(() => showToast('추첨 번호가 클립보드에 복사되었습니다!'))
        .catch(() => showToast('복사에 실패했습니다.'));
    }

    // Filter Pickers
    function initNumberGrid() {
      const grid = document.getElementById('numberGrid');
      grid.innerHTML = '';
      for (let i = 1; i <= 45; i++) {
        const chip = document.createElement('div');
        chip.className = 'pick-chip';
        chip.id = `chip-${i}`;
        chip.textContent = i;
        chip.onclick = () => toggleNumberFilter(i);
        grid.appendChild(chip);
      }
    }

    function setFilterMode(mode) {
      currentFilterMode = mode;
      document.getElementById('tabInclude').classList.toggle('active', mode === 'include');
      document.getElementById('tabExclude').classList.toggle('active', mode === 'exclude');
      document.getElementById('filterGuideText').textContent = 
        mode === 'include' 
          ? '번호를 탭하여 반드시 포함할 번호를 선택하세요 (최대 5개).' 
          : '번호를 탭하여 추첨에서 제외할 번호를 선택하세요.';
    }

    function toggleNumberFilter(num) {
      if (currentFilterMode === 'include') {
        if (excludeNumbers.has(num)) excludeNumbers.delete(num);
        if (includeNumbers.has(num)) {
          includeNumbers.delete(num);
        } else {
          if (includeNumbers.size >= 5) {
            showToast('포함 번호는 최대 5개까지만 선택할 수 있습니다.');
            return;
          }
          includeNumbers.add(num);
        }
      } else {
        if (includeNumbers.has(num)) includeNumbers.delete(num);
        if (excludeNumbers.has(num)) {
          excludeNumbers.delete(num);
        } else {
          if (excludeNumbers.size >= 39) {
            showToast('최소 6개의 번호는 남아있어야 합니다.');
            return;
          }
          excludeNumbers.add(num);
        }
      }
      updateChipVisuals();
    }

    function updateChipVisuals() {
      for (let i = 1; i <= 45; i++) {
        const chip = document.getElementById(`chip-${i}`);
        chip.className = 'pick-chip';
        if (includeNumbers.has(i)) chip.classList.add('selected-include');
        if (excludeNumbers.has(i)) chip.classList.add('selected-exclude');
      }
    }

    function resetFilters() {
      includeNumbers.clear();
      excludeNumbers.clear();
      updateChipVisuals();
      showToast('필터가 초기화되었습니다.');
    }

    function toggleAccordion() {
      const content = document.getElementById('filterContent');
      const icon = document.getElementById('arrowIcon');
      const isOpen = content.classList.toggle('open');
      icon.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    // Toast
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      initNumberGrid();
      renderHistory();
    });
  </script>
</body>
</html>
